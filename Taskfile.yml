# Task (taskfile.dev) command surface for Event Horizon macOS App & SDK
version: '3'

vars:
  APP_NAME: Event Horizon
  BUNDLE_ID: com.castlemilk.eventhorizon
  BUNDLE_DIR: build/Event Horizon.app
  INSTALLER_PKG: build/EventHorizon-1.0.0-AppStore.pkg
  INSTALLER_DMG: build/EventHorizon-1.0.0-macOS.dmg
  INSTALLER_IDENTITY: "3rd Party Mac Developer Installer: Ben Ebsworth"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ── everyday dev loops & relaunch ──────────────────────────────────────
  dev:
    desc: Build local app bundle and launch Event Horizon.app
    cmds:
      - task: build
      - open "{{.BUNDLE_DIR}}"

  relaunch:
    desc: Kill running app/daemon, rebuild app & MCP server, and relaunch on macOS
    cmds:
      - echo "==> Killing previous usbwifi processes and macOS app..."
      - pkill -9 -f "Event Horizon" || true
      - pkill -9 -f "Universal WiFi Manager" || true
      - pkill -9 -f "Starlink WiFi Manager" || true
      - pkill -9 -x "usbwifi" || true
      - pkill -9 -x "usbwifi-mcp" || true
      - killall -9 swift-build swift-frontend 2>/dev/null || true
      - lsof -ti :8990 | xargs kill -9 || true
      - task: build
      - echo "==> Relaunching {{.BUNDLE_DIR}}..."
      - open "{{.BUNDLE_DIR}}"
      - echo "SUCCESS Relaunched Event Horizon!"

  run:
    desc: Alias for relaunch workflow
    cmds:
      - task: relaunch

  test:
    desc: Run Go & Swift unit test suites
    cmds:
      - go test ./...
      - swift test

  test:e2e:
    desc: Run end-to-end app bundle integrity verification
    cmds:
      - chmod +x ./scripts/verify_bundle.sh
      - ./scripts/verify_bundle.sh

  build:mcp:
    desc: Compile Model Context Protocol (MCP) Server binary for AI agents
    cmds:
      - echo "==> Compiling usbwifi-mcp server..."
      - go build -buildvcs=false -o bin/usbwifi-mcp ./cmd/usbwifi-mcp
      - echo "SUCCESS Compiled bin/usbwifi-mcp"

  build:
    desc: Build macOS App Bundle and Distribution PKG/DMG
    deps: [build:mcp]
    cmds:
      - ./scripts/package_app.sh

  check:
    desc: Full pre-push quality gate — unit tests, app packaging, and E2E bundle verification
    cmds:
      - task: test
      - task: build
      - task: test:e2e

  # ── release & distribution entrypoints ─────────────────────────────────
  release:dmg:
    desc: Build direct distribution DMG installer
    cmds:
      - task: build
      - echo "==> Packaging {{.INSTALLER_DMG}} installer..."
      - hdiutil create -volname "{{.APP_NAME}}" -srcfolder "{{.BUNDLE_DIR}}" -ov -format UDZO "{{.INSTALLER_DMG}}"
      - echo "SUCCESS Created {{.INSTALLER_DMG}}"

  release:mas:
    desc: Build PKG installer package for Mac App Store submission
    cmds:
      - task: build
      - echo "==> Preparing Mac App Store installer package..."
      - productbuild --component "{{.BUNDLE_DIR}}" /Applications "{{.INSTALLER_PKG}}" || true
      - echo "SUCCESS Created {{.INSTALLER_PKG}}"

  release:all:
    desc: Complete end-to-end release pipeline (Build -> DMG -> App Store PKG)
    cmds:
      - task: test
      - task: release:dmg
      - task: release:mas

  # ── AIC8800D80 USB Wi-Fi 6 driver stack ────────────────────────────────
  aic:status:
    desc: Show AIC8800D80 driver build / install / load status
    cmds:
      - ./bin/usbwifi driver status

  aic:build:
    desc: Build the AIC8800D80 DriverKit driver (.dext bundle)
    cmds:
      - ./bin/usbwifi driver build

  aic:install:
    desc: Build, install, and load the AIC8800D80 DriverKit driver (requires sudo)
    cmds:
      - sudo ./bin/usbwifi driver install

  aic:uninstall:
    desc: Unload and remove the AIC8800D80 DriverKit driver (requires sudo)
    cmds:
      - sudo ./bin/usbwifi driver uninstall

  aic:detect:
    desc: Detect the current AIC8800D80 USB stage (ZeroCD / BootROM / Operational)
    cmds:
      - ./bin/usbwifi aicloader --status

  aic:upload-firmware:
    desc: Upload firmware to the AIC8800D80 dongle (Stage 1 -> Stage 2, requires sudo)
    cmds:
      - sudo ./bin/usbwifi aicloader --kill-daemon --firmware-dir=~/.event-horizon/firmware

  aic:fetch-firmware:
    desc: Fetch the proprietary AIC8800D80 firmware blobs from github.com/radxa-pkg/aic8800
    cmds:
      - ./bin/usbwifi firmware fetch --target=aic8800D80 --out=~/.event-horizon/firmware

  aic:verify-firmware:
    desc: Verify the AIC8800D80 firmware blobs against their SHA-256 hashes
    cmds:
      - ./bin/usbwifi firmware verify --target=aic8800D80 --in=~/.event-horizon/firmware

  aic:install-all:
    desc: "Full install: fetch firmware, upload to dongle, install DriverKit driver (requires sudo)"
    cmds:
      - task: aic:fetch-firmware
      - task: aic:verify-firmware
      - task: aic:upload-firmware
      - task: aic:install
      - task: aic:status

  aic:e2e:
    desc: "Run full end-to-end install script (firmware + loader + driver + systemextensionsctl, requires sudo). WINDOW=1KB|word|full|skip selects the upload mode (default skip)."
    cmds:
      - sudo WINDOW={{.WINDOW}} ./scripts/e2e.sh

  aic:uninstall-all:
    desc: "Full uninstall: remove DriverKit driver, leave firmware on disk (requires sudo)"
    cmds:
      - task: aic:uninstall
